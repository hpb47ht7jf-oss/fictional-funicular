ul{padding-left:1.2em}
select,input{font:inherit;padding:10px;border:3px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg);min-width:60%}
label{font-weight:600}
.sr{position:absolute;left:-9999px}
